<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller</title>
    <link rel="stylesheet" href="CSS/controllerPage.css">  
    <script src="/JS/menu.js"></script> 
    <script src="/JS/script.js"></script> 
</head>
<body>
    <div class="header-container">
        <img src="/ico/mainOrange.png" alt="Orange Icon" class="header-icon">
        <div class="orange-bar"></div>
        <span class="title">Solar MD 001</span>
    </div>

    <div class="info-row">
        <span class="date-label">Date: 22/09/2026</span>
        <span id="connectionStatus" class="status-connecting">Connecting</span>
    </div>

    <!-- Video Display Card -->
    <div class="video-card" style="position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000;">
        <!-- Live Video Stream -->
        <img 
            id="streamFeed" 
            alt="Live Stream" 
            style="width: 100%; height: 100%; object-fit: cover; display: none;"
        />

        <!-- Connecting / Spinner Fallback -->
        <div id="loadingState" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div class="spinner"></div>
            <span class="video-text">Connecting</span>
        </div>
    </div>
    
    <div class="cam-header">
        <div class="cam-title-area">
            <span class="cam-icon">📷</span>
            <span class="cam-name">Front Cam</span>
        </div>
        <span class="switch-cam">Switch Cam</span>
    </div>
    
    <div class="orange-progress-bar"></div>
    
    <div class="control-section">
        <div class="section-title">Control</div>
        
        <div class="dpad-row">
            <button class="control-btn">←</button>
            <button class="control-btn">↑</button>
            <button class="control-btn">↓</button>
            <button class="control-btn">→</button>
        </div>

        <div class="action-row">
            <button class="control-btn power-btn">⏻</button>
            <button class="control-btn wide-btn">Start | Break</button>
        </div>
    </div>

    <button id="menuButton" class="menu-fab">
        Menu
    </button>

    <script>
        const STREAM_URL = "http://192.168.1.112:5000/video_feed";
        const streamImg = document.getElementById('streamFeed');
        const loadingState = document.getElementById('loadingState');
        const statusLabel = document.getElementById('connectionStatus');

        let retryInterval = null;

        function connectStream() {
            // Force show the video element immediately and hide loading spinner
            streamImg.style.display = 'block';
            loadingState.style.display = 'none';
            if (statusLabel) {
                statusLabel.textContent = 'Connected';
                statusLabel.className = 'status-connected';
            }

            // Load the exact working IP URL directly
            streamImg.src = STREAM_URL;
        }

        streamImg.onerror = () => {
            // If connection drops, hide image and show loading state
            streamImg.style.display = 'none';
            loadingState.style.display = 'flex';
            if (statusLabel) {
                statusLabel.textContent = 'Connecting';
                statusLabel.className = 'status-connecting';
            }

            // Retry connection after 2 seconds
            if (!retryInterval) {
                retryInterval = setTimeout(() => {
                    retryInterval = null;
                    connectStream();
                }, 2000);
            }
        };

        // Start stream connection on initial page load
        connectStream();
    </script>
</body>
</html>
